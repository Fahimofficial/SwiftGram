name: Build Debug APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@9bb56186c3b09b1be8f5a271490910917bbf60f7

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf33d8d93f3d5f3ac1ee7999e889
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@00881fb6cba1901a695e91159db979cba61f2437

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "telegram.api.id=${{ secrets.TELEGRAM_API_ID }}" >> local.properties
          echo "telegram.api.hash=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK to artifacts
        uses: actions/upload-artifact@1746f4ab65b179e0ea60a494b83293b504c4d94f
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Run lint checks
        run: ./gradlew lint --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@1746f4ab65b179e0ea60a494b83293b504c4d94f
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          retention-days: 7

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@1746f4ab65b179e0ea60a494b83293b504c4d94f
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7
